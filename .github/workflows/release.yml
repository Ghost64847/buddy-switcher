name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
          - os: windows-latest
            os_name: Windows
          - os: ubuntu-latest
            os_name: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Install PyInstaller & PySide6
        run: pip install pyinstaller PySide6

      - name: Run self tests
        run: python tests/selftest.py

      - name: Build (macOS app + dmg)
        if: runner.os == 'macOS'
        run: |
          bash scripts/package_macos.sh
          cp dist/BuddySwitcher-macOS.dmg BuddySwitcher-macOS.dmg

      - name: Build (Windows exe + zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name BuddySwitcher \
            --icon assets/icon.ico \
            --add-data "assets/icon_1024.png;assets" buddy_switch.py
          7z a BuddySwitcher-Windows.zip ./dist/BuddySwitcher

      - name: Build (Linux binary + tar.gz)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onedir --name BuddySwitcher \
            --add-data "assets/icon_1024.png:assets" buddy_switch.py
          tar -czf BuddySwitcher-Linux-x86_64.tar.gz -C dist BuddySwitcher
          ./dist/BuddySwitcher/BuddySwitcher --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: BuddySwitcher-${{ matrix.os_name }}
          path: |
            BuddySwitcher-macOS.dmg
            BuddySwitcher-Windows.zip
            BuddySwitcher-Linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/BuddySwitcher-macOS.dmg
            out/BuddySwitcher-Windows.zip
            out/BuddySwitcher-Linux-x86_64.tar.gz
          generate_release_notes: true
