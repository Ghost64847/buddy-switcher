name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            os_name: macOS
          - os: windows-latest
            os_name: Windows
          - os: ubuntu-24.04
            os_name: Linux
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1

      - name: Install PyInstaller & PySide6
        run: pip install pyinstaller PySide6

      - name: Run self tests
        run: python tests/selftest.py

      - name: Build (macOS app + dmg)
        if: runner.os == 'macOS'
        run: |
          bash scripts/package_macos.sh
          cp dist/BuddySwitcher-macOS.dmg BuddySwitcher-macOS.dmg

      - name: Build (Windows exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean scripts/BuddySwitcher-Windows.spec
          cp dist/BuddySwitcher.exe BuddySwitcher.exe

      - name: Build (Linux binary + tar.gz)
        if: runner.os == 'Linux'
        run: |
          QM_ARGS="$(python -c "
          import glob
          import os
          import PySide6
          base = os.path.dirname(PySide6.__file__)
          sep = ';' if os.name == 'nt' else ':'
          files = []
          for qm in ('qtbase_zh_CN.qm', 'qt_zh_CN.qm'):
              files += glob.glob(os.path.join(base, '**', qm), recursive=True)[:1]
          print(' '.join('--add-data ' + f + sep + 'translations' for f in files))
          ")"
          pyinstaller --noconfirm --clean --onedir --name BuddySwitcher \
            --add-data "assets/icon_1024.png:assets" $QM_ARGS buddy_switch.py
          python scripts/prune_qt.py dist/BuddySwitcher
          tar -czf BuddySwitcher-Linux-x86_64.tar.gz -C dist BuddySwitcher
          ./dist/BuddySwitcher/BuddySwitcher --help >/dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: BuddySwitcher-${{ matrix.os_name }}
          path: |
            BuddySwitcher-macOS.dmg
            BuddySwitcher.exe
            BuddySwitcher-Linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/BuddySwitcher-macOS.dmg
            out/BuddySwitcher.exe
            out/BuddySwitcher-Linux-x86_64.tar.gz
          generate_release_notes: true
